<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Clean white background -->
  <rect width="400" height="400" rx="80" fill="#ffffff" />

  <!-- LIGHT RAYS RADIATING FROM BULB -->
  <g stroke="#fbc02d" stroke-width="4.5" stroke-linecap="round">
    <!-- Far Left horizontal -->
    <line x1="72" y1="240" x2="112" y2="240" />
    <!-- Top-Left diagonal -->
    <line x1="102" y1="152" x2="136" y2="176" />
    <!-- Bottom-Left diagonal -->
    <line x1="102" y1="328" x2="136" y2="304" />
    <!-- Top-Right diagonal -->
    <line x1="298" y1="152" x2="264" y2="176" />
    <!-- Far Right horizontal -->
    <line x1="328" y1="240" x2="288" y2="240" />
    <!-- Bottom-Right diagonal -->
    <line x1="298" y1="328" x2="264" y2="304" />
  </g>

  <!-- SHOWER PIPE & SHOWER HEAD (Top) -->
  <g fill="none" stroke="#41536b" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pipe coming down from top, bending right, then down -->
    <path d="M 195 0 L 195 24 C 195 38 206 48 220 48 L 240 48 C 254 48 265 58 265 72 L 265 85" stroke-width="12" />
  </g>
  <!-- Shower Head Plate -->
  <g fill="#41536b">
    <rect x="206" y="80" width="118" height="22" rx="6" />
    <!-- Dark shower nozzle face underneath -->
    <rect x="212" y="100" width="106" height="6" rx="3" fill="#2d3a4d" />
  </g>

  <!-- WATER SPRAY & DROPLETS -->
  <g stroke-linecap="round">
    <!-- Stream 1 (Leftmost angle) -->
    <line x1="155" y1="108" x2="135" y2="200" stroke="#528ebb" stroke-width="6" />
    <line x1="130" y1="220" x2="120" y2="270" stroke="#528ebb" stroke-width="5" />
    
    <!-- Stream 2 -->
    <line x1="180" y1="108" x2="168" y2="185" stroke="#71abc8" stroke-width="7" />
    <line x1="162" y1="210" x2="152" y2="280" stroke="#528ebb" stroke-width="6" stroke-dasharray="16 8" />

    <!-- Stream 3 (Center left) -->
    <line x1="205" y1="108" x2="198" y2="210" stroke="#528ebb" stroke-width="8" />
    <line x1="195" y1="230" x2="190" y2="310" stroke="#f1d842" opacity="0.3" stroke-width="6" />

    <!-- Stream 4 (Center right) -->
    <line x1="235" y1="108" x2="235" y2="190" stroke="#71abc8" stroke-width="8" />
    <line x1="235" y1="210" x2="235" y2="330" stroke="#528ebb" stroke-width="7" stroke-dasharray="24 10" />

    <!-- Stream 5 -->
    <line x1="260" y1="108" x2="265" y2="195" stroke="#f1d842" opacity="0.4" stroke-width="5" />
    <line x1="268" y1="215" x2="275" y2="310" stroke="#528ebb" stroke-width="7" />

    <!-- Stream 6 (Rightmost angle) -->
    <line x1="285" y1="108" x2="298" y2="210" stroke="#528ebb" stroke-width="6" />
    <line x1="303" y1="230" x2="312" y2="285" stroke="#71abc8" stroke-width="5" />

    <!-- Droplets -->
    <circle cx="170" cy="118" r="4" fill="#528ebb" />
    <circle cx="218" cy="120" r="5" fill="#fbc02d" />
    <circle cx="250" cy="116" r="4" fill="#528ebb" />
    <circle cx="288" cy="125" r="4.5" fill="#71abc8" />
    <circle cx="145" cy="150" r="4" fill="#71abc8" />
    <circle cx="282" cy="170" r="4.5" fill="#528ebb" />
  </g>

  <!-- LIGHTBULB (Center) -->
  <g>
    <!-- Canary Yellow Bulb Body -->
    <path d="M 200 160
             C 152 160 132 195 142 245
             C 148 275 170 292 170 310
             L 230 310
             C 230 292 252 275 258 245
             C 268 195 248 160 200 160 Z"
          fill="#ffea00" />

    <!-- Bulb Filament -->
    <path d="M 182 310 L 182 255 L 192 235 L 208 235 L 218 255 L 218 310"
          fill="none" stroke="#795548" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Socket Base -->
    <path d="M 172 310 L 228 310 L 225 338 L 175 338 Z" fill="#41536b" />
    <rect x="178" y="338" width="44" height="12" rx="4" fill="#2d3a4d" />
  </g>

  <!-- WATER SPLASH AT BOTTOM (Shards & Droplets) -->
  <g fill="#71abc8" opacity="0.95">
    <path d="M 120 352 L 155 348 L 148 360 L 122 362 Z" />
    <path d="M 150 350 L 190 345 L 210 355 L 140 368 Z" fill="#528ebb" />
    <path d="M 195 352 L 250 346 L 275 358 L 180 370 Z" fill="#8bc2e2" />
    <path d="M 240 355 L 285 350 L 270 365 L 230 365 Z" fill="#528ebb" />
    <path d="M 130 365 L 175 362 L 220 375 L 125 372 Z" fill="#9cd2ee" />
    <path d="M 210 365 L 265 362 L 255 375 L 200 374 Z" fill="#609dc3" />
  </g>
</svg>
